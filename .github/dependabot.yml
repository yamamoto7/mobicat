version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Its ref is a Rust version (the MSRV job uses @1.88), not an action version.
      - dependency-name: dtolnay/rust-toolchain
