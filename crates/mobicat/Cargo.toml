[package]
name = "mobicat"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["android", "ios", "logcat", "tui", "logs"]
categories = ["command-line-utilities", "development-tools::debugging"]
description = "One log viewer for Android and iOS: your app's logs only, crashes with stack traces, the same keys and filters on both"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.39"
mobicat-core = { version = "0.1.0", path = "../mobicat-core" }
mobicat-sources = { version = "0.1.0", path = "../mobicat-sources" }
mobicat-tui = { version = "0.1.0", path = "../mobicat-tui" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-std", "io-util"] }
toml = { version = "1.2.1", features = ["preserve_order"] }

[package.metadata.dist]
# Built and released by dist even though the crate is not on crates.io yet.
dist = true

[lints]
workspace = true
