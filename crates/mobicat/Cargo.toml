[package]
name = "mobicat"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["android", "ios", "logcat", "tui", "logs"]
categories = ["command-line-utilities", "development-tools::debugging"]
description = "One log viewer for Android and iOS: your app's logs only, crashes with stack traces, the same keys and filters on both"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.39"
mobicat-core = { version = "0.1.2", path = "../mobicat-core" }
mobicat-sources = { version = "0.1.2", path = "../mobicat-sources" }
mobicat-tui = { version = "0.1.2", path = "../mobicat-tui" }
strsim = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "io-std", "io-util"] }
toml = { version = "1.2.1", features = ["preserve_order"] }

[package.metadata.dist]
dist = true

# cargo binstall downloads the archives that dist uploads to GitHub Releases.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[lints]
workspace = true
