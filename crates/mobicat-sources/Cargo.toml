[package]
name = "mobicat-sources"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Log sources for mobicat: adb logcat, iOS simulator log stream, iPhones over usbmuxd, files"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false }
idevice = { version = "0.1.68", default-features = false, features = ["ring", "usbmuxd", "syslog_relay", "installation_proxy"] }
jiff = "0.2.39"
plist = "1"
mobicat-core = { version = "0.3.0", path = "../mobicat-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros", "process", "io-util", "fs", "io-std"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
uuid = "1"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "test-util", "sync"] }

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal"] }
