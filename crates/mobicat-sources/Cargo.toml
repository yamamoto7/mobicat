[package]
name = "mobicat-sources"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
description = "Log sources for mobicat: adb logcat, iOS simulator log stream, files"

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.39"
mobicat-core = { version = "0.1.1", path = "../mobicat-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros", "process", "io-util", "fs", "io-std"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "test-util", "sync"] }

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal"] }
